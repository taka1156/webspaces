# yarn の npmMinimalAgeGate: 0 と同等（公開直後のバージョンも解決する）
minimumReleaseAge: 0

# yarn の resolutions から移行
overrides:
  '@types/react': 19.3.3
  '@types/react-dom': 19.3.0

# pnpm はデフォルトで依存パッケージのビルドスクリプトを実行しないため、必要なものだけ許可する
allowBuilds:
  # webpack 系の optional peer として入るだけで実行時に使わないため postinstall を止める
  '@swc/core': false
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
